services:
  postgres:
    image: postgres:16-alpine
    container_name: face-attendance-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: face_attendance
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: face-attendance-backend
    ports:
      - "8005:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/face_attendance
    volumes:
      # Persist downloaded models + registered face photos across restarts
      - backend-models:/app/models
      - backend-known-faces:/app/known_faces
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: face-attendance-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-models:
  backend-known-faces:
  postgres-data:
